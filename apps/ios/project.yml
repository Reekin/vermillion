name: Vermillion
options:
  bundleIdPrefix: app.vermillion
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Vermillion:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vermillion.mobile
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Vermillion
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描桌面配对二维码
        CFBundleURLTypes:
          - CFBundleURLSchemes: [vermillion]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: Config/Vermillion.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
  VermillionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Vermillion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  VermillionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Vermillion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vermillion:
    build:
      targets:
        Vermillion: all
    test:
      targets: [VermillionTests, VermillionUITests]
